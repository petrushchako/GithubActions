name: Run Container Action

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name to be called'
        required: true
        default: 'Alex'
        type: string

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Chckout code
        uses: actions/checkout@v7

      - name: Run my container action
        uses: ./.github/actions/container-action
        with:
          name: "Alex"