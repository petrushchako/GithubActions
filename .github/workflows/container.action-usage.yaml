name: Action Types

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name to be called'
        required: true
        default: 'Alex'
        type: string
      action-type:
        description: 'Select action type'
        required: true
        default: 'container'
        type: choice
        options:
            - container
            - javascript
            - composite

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Show event trigger
        run: echo "Triggered by ${{github.event_name }}"
    
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run my container action
        if: ${{ github.event.inputs.action-type == 'container' }}
        uses: ./.github/actions/container-action
        with:
          name: ${{ inputs.name }}

      - name: Run my container action
        if: ${{ github.event.inputs.action-type == 'javascript' }}
        uses: ./.github/actions/js-action
        with:
          name: ${{ inputs.name }}

      - name: Run my container action
        if: ${{ github.event.inputs.action-type == 'composite' }}
        uses: ./.github/actions/composite-action
        with:
          name: ${{ inputs.name }}
