name: Build and Download

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install
        working-directory: node-app

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: weather-app
          path: node-app/
          retention-days: 1

  check-weather:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: weather-app
          path: node-app/

      - name: Get weather information
        run: npm run start
        working-directory: node-app