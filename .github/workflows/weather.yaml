name: Fetch Weather

on: 
  push: 
    branches: [main]
  workflow_dispatch:

jobs:
  run-weather-app:
    runs-on: ubuntu-latest

    # Set working directory if your package.json is inside a subdirectory (e.g., node-app)
    # defaults:
    #   run:
    #     working-directory: ./node-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Weather Script
        run: npm start